metrics:
  Revenue:
    expression: '[Unit Price] * [Quantity]'
    aggregation: sum
    context_state_name: Default
    ignore_dimensions: false
    ignore_context_filters: false
  Total Revenue:
    expression: '[Unit Price] * [Quantity]'
    aggregation: sum
    context_state_name: Default
    ignore_dimensions: true
    ignore_context_filters: false
  Cost:
    expression: '[Cost]'
    aggregation: sum
    context_state_name: Default
    ignore_dimensions: false
    ignore_context_filters: false
  avg Unit Price:
    expression: '[Unit Price]'
    aggregation: mean
    context_state_name: Default
    ignore_dimensions: false
    ignore_context_filters: false
  number of Orders:
    expression: '[SalesOrderNumber]'
    aggregation: count_distinct
    context_state_name: Default
    ignore_dimensions: false
    ignore_context_filters: false
  Avg Revenue by Product-Region Group:
    expression: '[Unit Price]*[Quantity]'
    aggregation: mean
    context_state_name: Default
    ignore_dimensions: false
    ignore_context_filters: false
    nested:
      dimensions:
      - Product
      - Region
      aggregation: sum
      compose: null
derived_metrics:
  Margin:
    expression: '[Revenue] - [Cost]'
    fillna: 0
  Margin %:
    expression: 100 * ([Revenue] - [Cost]) / [Revenue]
  Revenue over Total:
    expression: '[Revenue] / [Total Revenue]'
  Revenue Rank:
    expression: '@pd.Series([Revenue]).rank(ascending=True, method="dense")'
queries:
  Sales by Country and Category:
    dimensions:
    - Country
    - Category
    metrics:
    - Revenue
    derived_metrics:
    - Margin %
    - Revenue over Total
    - Revenue Rank
    sort:
    - column: Revenue
      direction: asc
    - column: Margin
      direction: desc
    plots:
      bar plot:
        plot_type: bar
        dimensions:
        - Country
        - Category
        metrics:
        - Revenue
        color_by: null
        title: Sales by Country and Category
        stacked: true
        figsize: null
        orientation: vertical
        palette: null
        sort_values: false
        sort_ascending: true
        limit: null
        formatter: null
        annotations: null
        custom_options: {}
    drop_null_dimensions: true
    drop_null_metric_results: false
  avg Unit Price by Category & Business Type:
    dimensions:
    - Category
    - Business Type
    metrics:
    - avg Unit Price
    derived_metrics: &id004 []
    sort: []
    drop_null_dimensions: false
    drop_null_metric_results: false
  High-Margin Products (>35%):
    dimensions: &id001
    - Product
    metrics:
    - number of Orders
    derived_metrics:
    - Margin
    having: '[Margin %] >= 35'
    sort:
    - column: Margin
      direction: desc
    plots:
      Default combo < system generated >:
        plot_type: combo
        dimensions: *id001
        metrics:
        - number of Orders
        - Margin
        color_by: null
        title: High-Margin Products (>35%)
        stacked: false
        figsize: null
        orientation: vertical
        palette: null
        sort_values: false
        sort_ascending: true
        limit: null
        formatter: null
        annotations: null
        custom_options: {}
    drop_null_dimensions: true
    drop_null_metric_results: false
  Revenue vs Margin by Category:
    dimensions: &id002
    - Category
    metrics:
    - Revenue
    derived_metrics:
    - Margin
    sort:
    - column: Margin
      direction: asc
    plots:
      combo plot:
        plot_type: combo
        dimensions: *id002
        metrics:
        - Revenue
        - Margin
        color_by: null
        title: Revenue vs Margin by Category
        stacked: false
        figsize: null
        orientation: vertical
        palette: null
        sort_values: false
        sort_ascending: true
        limit: null
        formatter: null
        annotations: null
        custom_options: {}
    drop_null_dimensions: true
    drop_null_metric_results: false
